<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      max-width: 760px;
      margin: 0 auto;
      padding: 56px 48px 96px;
      color: #252525;
      background: #fff;
      font: 17px/1.72 Georgia, "Times New Roman", serif;
      -webkit-font-smoothing: antialiased;
    }
    h1 { margin: 2.2em 0 .8em; font-size: 1.65em; font-weight: 500; }
    h2 { margin: 1.8em 0 .65em; font-size: 1.25em; font-weight: 500; }
    p { margin: 0 0 1em; }
    .display { margin: 1.3em 0; overflow-x: auto; text-align: center; }
    .error { color: #a33; white-space: pre-wrap; }
    @media (max-width: 600px) { body { padding: 28px 22px 60px; } }
  </style>
</head>
<body>
  <main id="document"></main>
  <script>
    let source = "";
    const escapeHtml = text => text.replace(/[&<>"']/g, char => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    })[char]);

    function render() {
      let text = source
        .replace(/\\documentclass(?:\[[^\]]*\])?\{[^}]*\}/g, '')
        .replace(/\\usepackage(?:\[[^\]]*\])?\{[^}]*\}/g, '')
        .replace(/\\(?:title|author|date)\{[^}]*\}/g, '')
        .replace(/\\texttt\{([^{}]*)\}/g, '$1')
        .replace(/\\begin\{document\}|\\end\{document\}/g, '')
        .trim();
      const blocks = [];
      text = text.replace(/\\\[([\s\S]*?)\\\]/g, (_, math) => {
        blocks.push({ display: true, value: math.trim() });
        return `\n\n@@MATH${blocks.length - 1}@@\n\n`;
      });
      text = text.replace(/\\section\{([^{}]*)\}/g, (_, title) => `\n\n@@SECTION:${title}@@\n\n`)
        .replace(/\\subsection\{([^{}]*)\}/g, (_, title) => `\n\n@@SUBSECTION:${title}@@\n\n`);
      const chunks = text.split(/\n\s*\n/).map(part => part.trim()).filter(Boolean);
      const html = chunks.map(part => {
        const section = part.match(/^@@SECTION:(.*)@@$/s);
        if (section) return `<h1>${escapeHtml(section[1])}</h1>`;
        const subsection = part.match(/^@@SUBSECTION:(.*)@@$/s);
        if (subsection) return `<h2>${escapeHtml(subsection[1])}</h2>`;
        const block = part.match(/^@@MATH(\d+)@@$/);
        if (block) {
          const math = blocks[Number(block[1])].value;
          try {
            return `<div class="display">${katex.renderToString(math, { displayMode: true, throwOnError: false, strict: "ignore" })}</div>`;
          } catch (_) {
            return `<div class="display error">${escapeHtml(math)}</div>`;
          }
        }
        const inline = [];
        let paragraph = part.replace(/\$([^$\n]+)\$/g, (_, math) => {
          inline.push(math);
          return `@@INLINE${inline.length - 1}@@`;
        });
        paragraph = escapeHtml(paragraph).replace(/\\\\/g, '<br>');
        paragraph = paragraph.replace(/@@INLINE(\d+)@@/g, (_, index) => {
          const math = inline[Number(index)];
          try { return katex.renderToString(math, { throwOnError: false, strict: "ignore" }); }
          catch (_) { return `<span class="error">${escapeHtml(`$${math}$`)}</span>`; }
        });
        return `<p>${paragraph}</p>`;
      }).join('\n');
      document.getElementById('document').innerHTML = html;
    }

    window.updateSource = function(nextSource) {
      const x = window.scrollX;
      const y = window.scrollY;
      source = nextSource;
      render();
      requestAnimationFrame(() => window.scrollTo(x, y));
    };

    window.addEventListener('load', render);
  </script>
</body>
</html>
