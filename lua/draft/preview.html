<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="katex/katex.min.css">
  <script defer src="katex/katex.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    :root {
      color-scheme: light;
      --background: #fff;
      --foreground: #252525;
      --error: #a33;
      --warning-dot: #ffbd2e;
      --error-dot: #ff5f57;
      --sync-fill: rgba(92, 139, 176, .18);
      --sync-line: rgba(92, 139, 176, .5);
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --background: #1c1c1e;
      --foreground: #e5e5e7;
      --error: #ff9b96;
      --warning-dot: #ffbd2e;
      --error-dot: #ff5f57;
      --sync-fill: rgba(130, 178, 220, .24);
      --sync-line: rgba(130, 178, 220, .65);
    }
    html { background: var(--background); scrollbar-width: none; }
    html::-webkit-scrollbar, body::-webkit-scrollbar { display: none; }
    body {
      max-width: 760px;
      margin: 0 auto;
      padding: max(48px, calc(25vh - 24px)) 48px 75vh;
      color: var(--foreground);
      background: var(--background);
      font: 17px/1.72 Georgia, "Times New Roman", serif;
      -webkit-font-smoothing: antialiased;
    }
    h1 { margin: 2.2em 0 .8em; font-size: 1.65em; font-weight: 500; }
    h2 { margin: 1.8em 0 .65em; font-size: 1.25em; font-weight: 500; }
    p { margin: 0 0 1em; }
    .texttt { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, monospace; font-size: .9em; }
    .display { margin: 1.3em 0; overflow-x: auto; text-align: center; }
    .error { color: var(--error); white-space: pre-wrap; }
    #problems { position: fixed; top: 34px; right: 14px; z-index: 10; font: 12px/1.35 -apple-system, BlinkMacSystemFont, sans-serif; }
    #problem-dot { width: 12px; height: 12px; padding: 0; border: 0; border-radius: 50%; background: var(--warning-dot); cursor: pointer; }
    #problems.error #problem-dot { background: var(--error-dot); }
    #problem-detail { display: none; position: absolute; right: 0; top: 18px; min-width: 190px; max-width: 300px; padding: 8px 10px; border: 1px solid rgba(128,128,128,.28); border-radius: 7px; background: var(--background); color: var(--foreground); box-shadow: 0 3px 14px rgba(0,0,0,.12); }
    #problems:hover #problem-detail, #problems:focus-within #problem-detail, #problems.open #problem-detail { display: block; }
    #problem-detail button { display: block; width: 100%; padding: 3px 0; border: 0; background: none; color: inherit; text-align: left; font: inherit; cursor: pointer; }
    [data-source-start] { scroll-margin-block: 42vh; }
    ::highlight(draft-sync) { background: var(--sync-fill); text-decoration: underline; text-decoration-color: var(--sync-line); }
    .sync-target { background: var(--sync-fill); }
    #reading-mark { position: fixed; z-index: 5; top: 25vh; left: 8px; width: 3px; height: 18px; border-radius: 2px; background: var(--sync-line); pointer-events: none; opacity: .7; display: none; }
    @media (max-width: 600px) { body { padding: max(48px, calc(25vh - 24px)) 22px 75vh; } }
  </style>
</head>
<body>
  <div id="reading-mark" aria-hidden="true"></div>
  <div id="problems" hidden><button id="problem-dot" type="button" aria-label="Preview problems" aria-expanded="false"></button><div id="problem-detail"></div></div>
  <main id="document"></main>
  <script>
    let source = "";
    let previousBlocks = [];
    let highlightTimer;
    let syncRange;
    window.setDraftAppearance = function(mode) {
      document.documentElement.dataset.theme = mode === 'dark' ? 'dark' : 'light';
    };
    const escapeHtml = text => text.replace(/[&<>"']/g, char => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    })[char]);
    const byteLength = text => new TextEncoder().encode(text).length;
    const problem = (severity, message, startOffset, endOffset) => ({ severity, source: 'preview', message, startOffset, endOffset });
    function updateProblems(items) {
      const surface = document.getElementById('problems');
      const detail = document.getElementById('problem-detail');
      const dot = document.getElementById('problem-dot');
      surface.hidden = items.length === 0;
      surface.classList.toggle('error', items.some(item => item.severity === 'error'));
      surface.classList.remove('open');
      dot.setAttribute('aria-expanded', 'false');
      dot.setAttribute('aria-label', items.length ? `${items.length} preview ${items.length === 1 ? 'problem' : 'problems'}` : 'Preview problems');
      detail.replaceChildren();
      if (items.length > 1) {
        const summary = document.createElement('div');
        const errors = items.filter(item => item.severity === 'error').length;
        const warnings = items.length - errors;
        summary.textContent = [errors && `${errors} preview ${errors === 1 ? 'error' : 'errors'}`, warnings && `${warnings} preview ${warnings === 1 ? 'warning' : 'warnings'}`].filter(Boolean).join(' · ');
        detail.append(summary);
      }
      for (const item of items.slice(0, 5)) {
        const row = document.createElement('button');
        row.type = 'button';
        row.textContent = item.message;
        row.addEventListener('click', () => { window.location.href = `draft://jump?start=${item.startOffset}&end=${item.endOffset}`; });
        detail.append(row);
      }
    }
    document.getElementById('problem-dot').addEventListener('click', () => {
      const surface = document.getElementById('problems');
      surface.classList.toggle('open');
      document.getElementById('problem-dot').setAttribute('aria-expanded', String(surface.classList.contains('open')));
    });
    function proseWarnings(part, items) {
      const text = part.text;
      const skip = /\$[^$\n]+\$|\\(?:texttt|text)\{[^{}]*\}|\\\\/gy;
      for (let i = 0; i < text.length;) {
        skip.lastIndex = i;
        const known = skip.exec(text);
        if (known) { i = skip.lastIndex; continue; }
        if (text[i] === '\\' && /[A-Za-z@]/.test(text[i + 1] || '')) {
          const match = /^\\[A-Za-z@]+\*?/.exec(text.slice(i));
          const command = match[0];
          const start = part.offset + byteLength(text.slice(0, i));
          items.push(problem('warning', `Unsupported preview command ${command}`, start, start + byteLength(command)));
          i += command.length;
        } else i++;
      }
    }

    function parse() {
      const lines = source.split('\n');
      const lineOffsets = [];
      let total = 0;
      for (const line of lines) { lineOffsets.push(total); total += new TextEncoder().encode(line).length + 1; }
      const blocks = [];
      let current = null;
      let inDocument = false;
      const flush = () => {
        if (current && current.value.trim()) blocks.push(current);
        current = null;
      };
      for (let index = 0; index < lines.length; index++) {
        const line = lines[index];
        if (/\\begin\{document\}/.test(line)) { inDocument = true; continue; }
        if (/\\end\{document\}/.test(line)) { flush(); break; }
        if (!inDocument && /^\s*\\(?:documentclass|usepackage|title|author|date)\b/.test(line)) continue;
        const heading = line.match(/^\s*\\(section|subsection)\{([^{}]*)\}/);
        if (heading) {
          flush();
          const content = line.indexOf(heading[2]);
          blocks.push({ kind: heading[1], value: heading[2], start: index + 1, end: index + 1,
            startOffset: lineOffsets[index] + new TextEncoder().encode(line.slice(0, content)).length,
            endOffset: lineOffsets[index] + new TextEncoder().encode(line.slice(0, content + heading[2].length)).length });
          continue;
        }
        const displayEnvironment = line.match(/^\s*\\begin\{(equation\*?|align\*?|gather\*?|multline\*?)\}/);
        if (/\\\[/.test(line) || displayEnvironment) {
          flush();
          const environment = displayEnvironment && displayEnvironment[1];
          let value = displayEnvironment
            ? line.replace(/^.*?\\begin\{[^}]+\}/, '')
            : line.replace(/^.*?\\\[/, '');
          let end = index + 1;
          const closing = environment ? new RegExp(`\\\\end\\{${environment.replace('*', '\\*')}\\}`) : /\\\]/;
          while (!closing.test(value) && end < lines.length) value += '\n' + lines[end++];
          value = value.replace(environment ? new RegExp(`\\\\end\\{${environment.replace('*', '\\*')}\\}.*$`) : /\\\].*$/, '').trim();
          blocks.push({ kind: 'math', value, start: index + 1, end,
            startOffset: lineOffsets[index], endOffset: lineOffsets[Math.min(end - 1, lines.length - 1)] + new TextEncoder().encode(lines[Math.min(end - 1, lines.length - 1)]).length });
          index = end - 1;
          continue;
        }
        if (!line.trim()) { flush(); continue; }
        if (!current) current = { kind: 'paragraph', value: line, parts: [{ text: line, offset: lineOffsets[index] }], start: index + 1, end: index + 1, startOffset: lineOffsets[index], endOffset: lineOffsets[index] + new TextEncoder().encode(line).length };
        else { current.value += '\n' + line; current.parts.push({ text: line, offset: lineOffsets[index] }); current.end = index + 1; current.endOffset = lineOffsets[index] + new TextEncoder().encode(line).length; }
      }
      flush();
      return blocks;
    }

    function renderBlock(block, items) {
      const attr = `data-source-start="${block.start}" data-source-end="${block.end}" data-map-start="${block.startOffset}" data-map-end="${block.endOffset}"`;
      const mapped = (text, offset) => text
        ? `<span data-map-start="${offset}" data-map-end="${offset + new TextEncoder().encode(text).length}">${escapeHtml(text)}</span>`
        : '';
      if (block.kind === 'section') return `<h1 ${attr}>${mapped(block.value, block.startOffset)}</h1>`;
      if (block.kind === 'subsection') return `<h2 ${attr}>${mapped(block.value, block.startOffset)}</h2>`;
      if (block.kind === 'math') {
        try {
          return `<div class="display" ${attr}>${katex.renderToString(block.value, { displayMode: true, throwOnError: false, strict: "ignore" })}</div>`;
        } catch (_) {
          items.push(problem('error', 'Preview could not render a display equation', block.startOffset, block.endOffset));
          return `<div class="display error" ${attr}>${escapeHtml(block.value)}</div>`;
        }
      }
      const body = block.parts.map(part => {
        const token = /\$([^$\n]+)\$|\\(texttt|text)\{([^{}]*)\}|\\\\/g;
        let out = '', cursor = 0, match;
        while ((match = token.exec(part.text))) {
          out += mapped(part.text.slice(cursor, match.index), part.offset + new TextEncoder().encode(part.text.slice(0, cursor)).length);
          if (match[1] !== undefined) {
            const start = part.offset + new TextEncoder().encode(part.text.slice(0, match.index)).length;
            const end = part.offset + new TextEncoder().encode(part.text.slice(0, token.lastIndex)).length;
            try { out += `<span data-map-start="${start}" data-map-end="${end}" data-math="true">${katex.renderToString(match[1], { throwOnError: false, strict: "ignore" })}</span>`; }
            catch (_) { items.push(problem('error', 'Preview could not render an inline equation', start, end)); out += mapped(match[0], start); }
          } else {
            if (match[2] === undefined) out += '<br>';
            else {
              const textStart = match.index + match[0].indexOf('{') + 1;
              const commandStart = part.offset + byteLength(part.text.slice(0, match.index));
              const commandEnd = part.offset + byteLength(part.text.slice(0, token.lastIndex));
              out += `<span class="${match[2] === 'texttt' ? 'texttt' : ''}" data-inline-command="true" data-map-start="${commandStart}" data-map-end="${commandEnd}">${mapped(match[3], part.offset + byteLength(part.text.slice(0, textStart)))}</span>`;
            }
          }
          cursor = token.lastIndex;
        }
        out += mapped(part.text.slice(cursor), part.offset + new TextEncoder().encode(part.text.slice(0, cursor)).length);
        return out;
      }).join('<br>');
      return `<p ${attr}>${body}</p>`;
    }

    function render() {
      const root = document.getElementById('document');
      const items = [];
      const oldNodes = new Map();
      for (const block of previousBlocks) {
        const key = `${block.kind}\0${block.value}`;
        const nodes = oldNodes.get(key) || [];
        nodes.push(block);
        oldNodes.set(key, nodes);
      }
      let blocks;
      try { blocks = parse(); }
      catch (_) {
        previousBlocks = [];
        root.textContent = source;
        updateProblems([problem('error', 'Preview could not parse this source', 0, byteLength(source))]);
        return;
      }
      let cursor = root.firstChild;
      for (const block of blocks) {
        if (block.kind === 'paragraph') block.parts.forEach(part => proseWarnings(part, items));
        if (block.kind === 'section' || block.kind === 'subsection') proseWarnings({ text: block.value, offset: block.startOffset }, items);
        const key = `${block.kind}\0${block.value}`;
        const reusable = oldNodes.get(key);
        const prior = reusable && reusable.length ? reusable.shift() : null;
        let element = prior?.element || null;
        if (!element) {
          const template = document.createElement('template');
          const before = items.length;
          try { template.innerHTML = renderBlock(block, items); }
          catch (_) {
            items.push(problem('error', 'Preview could not render this block', block.startOffset, block.endOffset));
            template.innerHTML = `<p class="error" data-source-start="${block.start}" data-source-end="${block.end}" data-map-start="${block.startOffset}" data-map-end="${block.endOffset}">${escapeHtml(block.value)}</p>`;
          }
          block.errors = items.slice(before).filter(item => item.severity === 'error');
          element = template.content.firstElementChild;
        } else {
          block.errors = (prior.errors || []).map(item => ({ ...item,
            startOffset: item.startOffset + block.startOffset - prior.startOffset,
            endOffset: item.endOffset + block.startOffset - prior.startOffset }));
          items.push(...block.errors);
          const offsetShift = block.startOffset - Number(element.dataset.mapStart);
          if (offsetShift !== 0) {
            element.querySelectorAll('[data-map-start], [data-map-end]').forEach(mapped => {
              if (mapped.dataset.mapStart !== undefined) mapped.dataset.mapStart = Number(mapped.dataset.mapStart) + offsetShift;
              if (mapped.dataset.mapEnd !== undefined) mapped.dataset.mapEnd = Number(mapped.dataset.mapEnd) + offsetShift;
            });
          }
        }
        element.dataset.sourceStart = block.start;
        element.dataset.sourceEnd = block.end;
        element.dataset.mapStart = block.startOffset;
        element.dataset.mapEnd = block.endOffset;
        block.element = element;
        if (element !== cursor) root.insertBefore(element, cursor);
        cursor = element.nextSibling;
      }
      while (cursor) {
        const next = cursor.nextSibling;
        root.removeChild(cursor);
        cursor = next;
      }
      previousBlocks = blocks;
      updateProblems(items);
      updateReadingMark();
    }

    function clearSync() {
      if (window.CSS && CSS.highlights) CSS.highlights.delete('draft-sync');
      const selection = window.getSelection();
      if (syncRange && selection.rangeCount && selection.getRangeAt(0) === syncRange) selection.removeAllRanges();
      document.querySelectorAll('.sync-target').forEach(element => element.classList.remove('sync-target'));
      syncRange = null;
    }

    function highlight(range, fallback) {
      clearTimeout(highlightTimer);
      clearSync();
      if (range) {
        syncRange = range;
        if (window.CSS && CSS.highlights && window.Highlight) CSS.highlights.set('draft-sync', new Highlight(range));
        const selection = window.getSelection();
        selection.removeAllRanges();
        selection.addRange(range);
      } else if (fallback) fallback.classList.add('sync-target');
      highlightTimer = setTimeout(clearSync, 1800);
    }

    function utf16AtByte(text, byteOffset) {
      let bytes = 0;
      for (let i = 0; i < text.length;) {
        const cp = text.codePointAt(i), chars = cp > 0xffff ? 2 : 1;
        const size = new TextEncoder().encode(String.fromCodePoint(cp)).length;
        if (bytes + size > byteOffset) return i;
        bytes += size; i += chars;
      }
      return text.length;
    }

    function pointAt(offset, endPoint = false) {
      const contains = el => endPoint
        ? Number(el.dataset.mapStart) < offset && offset <= Number(el.dataset.mapEnd)
        : Number(el.dataset.mapStart) <= offset && offset < Number(el.dataset.mapEnd);
      // Command wrappers include invisible source syntax; only their mapped text
      // children have a one-to-one byte correspondence with rendered text.
      const spans = [...document.querySelectorAll('span[data-map-start][data-map-end]')].filter(el => !el.dataset.math && !el.dataset.inlineCommand);
      const span = spans.find(contains);
      if (!span) {
        const command = [...document.querySelectorAll('[data-inline-command]')].find(contains);
        const inner = command?.querySelector('span[data-map-start]');
        if (inner) {
          const first = Number(inner.dataset.mapStart), last = Number(inner.dataset.mapEnd);
          if (offset <= first) return pointAt(first);
          if (offset >= last) return pointAt(last, true);
        }
        const math = [...document.querySelectorAll('[data-math="true"]')].find(contains);
        if (!math || !math.parentNode) return null;
        const index = [...math.parentNode.childNodes].indexOf(math);
        return [math.parentNode, index + (endPoint ? 1 : 0)];
      }
      const walker = document.createTreeWalker(span, NodeFilter.SHOW_TEXT);
      let node, left = offset - Number(span.dataset.mapStart);
      while ((node = walker.nextNode())) {
        const length = new TextEncoder().encode(node.nodeValue).length;
        if (left <= length) return [node, utf16AtByte(node.nodeValue, left)];
        left -= length;
      }
      return null;
    }

    function rangeFor(start, end) {
      const a = pointAt(start), b = pointAt(end, true);
      if (!a || !b) return null;
      const range = document.createRange();
      range.setStart(a[0], a[1]); range.setEnd(b[0], b[1]);
      return range;
    }

    window.sourceToPreview = function(start, end, mode) {
      const blocks = [...document.querySelectorAll('[data-source-start]')];
      if (!blocks.length) return;
      let block = blocks.find(el => Number(el.dataset.mapStart) <= start && Number(el.dataset.mapEnd) >= start);
      if (!block) block = blocks.reduce((nearest, el) => Math.abs(Number(el.dataset.mapStart) - start) < Math.abs(Number(nearest.dataset.mapStart) - start) ? el : nearest, blocks[0]);
      const show = (range, fallback) => {
        highlight(range, fallback);
        const rect = range?.getBoundingClientRect() || fallback?.getBoundingClientRect();
        if (rect) window.scrollBy({ top: rect.top - readingY, behavior: 'smooth' });
      };
      if (mode === 'cursor') {
        const math = [...block.querySelectorAll('[data-math="true"]')].find(el => Number(el.dataset.mapStart) <= start && Number(el.dataset.mapEnd) >= start);
        if (math) { show(null, math); return; }
        const inline = [...block.querySelectorAll('[data-inline-command]')]
          .filter(el => Number(el.dataset.mapStart) <= start && start < Number(el.dataset.mapEnd))
          .sort((a, b) => (Number(a.dataset.mapEnd) - Number(a.dataset.mapStart)) - (Number(b.dataset.mapEnd) - Number(b.dataset.mapStart)))[0];
        if (inline) {
          const inner = inline.querySelector('span[data-map-start]');
          if (inner) { show(rangeFor(Number(inner.dataset.mapStart), Number(inner.dataset.mapEnd)), inner); return; }
        }
      }
      if (block.classList.contains('display')) { show(null, block); return; }
      const range = rangeFor(start, end);
      show(range, block);
    };

    document.getElementById('document').addEventListener('mousedown', () => {
      clearTimeout(highlightTimer);
      if (window.CSS && CSS.highlights) CSS.highlights.delete('draft-sync');
      syncRange = null;
    });

    let readingY = innerHeight * .25;
    let readingAnchor = null;
    let pendingG = false;
    function readingAt(y) {
      const doc = document.getElementById('document');
      const x = Math.min(innerWidth - 24, Math.max(24, doc.getBoundingClientRect().left + 30));
      let range = document.caretRangeFromPoint?.(x, Math.max(0, Math.min(innerHeight - 18, y)));
      let element = range?.startContainer?.parentElement?.closest('[data-map-start][data-map-end]');
      const visible = element?.getBoundingClientRect();
      if (!element || !doc.contains(element) || visible.bottom < 0 || visible.top > innerHeight) {
        element = nearestAnchor(y);
        range = null;
      }
      if (!element) return null;
      if (element.dataset.inlineCommand) element = element.querySelector('span[data-map-start]') || element;
      const rect = range?.getBoundingClientRect();
      const block = element.closest('[data-source-start]') || element;
      const lineY = rect && rect.height ? rect.top : element.getBoundingClientRect().top;
      const lineRange = document.caretRangeFromPoint?.(x, Math.max(0, Math.min(innerHeight - 18, lineY + 8)));
      const lineElement = lineRange?.startContainer?.parentElement?.closest('[data-map-start][data-map-end]');
      const chosen = lineElement && block.contains(lineElement) ? lineElement : element;
      const chosenRange = lineElement && block.contains(lineElement) ? lineRange : range;
      let offset = Number(chosen.dataset.mapStart);
      if (chosenRange && chosen.contains(chosenRange.startContainer) && !chosen.dataset.math && !chosen.closest('.display')) {
        const prefix = document.createRange();
        prefix.selectNodeContents(chosen);
        prefix.setEnd(chosenRange.startContainer, chosenRange.startOffset);
        offset += byteLength(prefix.toString());
      }
      return { element: chosen, y: lineY, offset };
    }
    function updateReadingMark() {
      readingY = innerHeight * .25;
      const mark = document.getElementById('reading-mark');
      const current = readingAt(readingY);
      if (!current) { mark.style.display = 'none'; delete mark.dataset.sourceOffset; readingAnchor = null; return; }
      readingAnchor = current;
      mark.dataset.sourceOffset = current.offset;
      mark.style.display = 'block';
    }
    function moveReading(lines) {
      window.scrollBy({ top: lines * lineHeight(), behavior: 'smooth' });
      requestAnimationFrame(updateReadingMark);
    }
    function nearestAnchor(y = readingY) {
      let nearest = null, distance = Infinity;
      for (const element of document.querySelectorAll('[data-map-start][data-map-end]')) {
        const rect = element.getBoundingClientRect();
        if (rect.bottom < 0 || rect.top > innerHeight) continue;
        const gap = Math.max(rect.top - y, y - rect.bottom, 0);
        if (gap < distance || (gap === distance && nearest?.contains(element))) {
          nearest = element; distance = gap;
        }
      }
      return nearest;
    }
    function jumpReading(last) {
      const positions = [...document.querySelectorAll('[data-source-start]')];
      const element = last ? positions.at(-1) : positions[0];
      if (!element) return;
      const rect = element.getBoundingClientRect();
      const y = last ? rect.bottom - lineHeight() : rect.top;
      window.scrollBy({ top: y - readingY, behavior: 'instant' });
      updateReadingMark();
    }
    window.addEventListener('scroll', () => { requestAnimationFrame(updateReadingMark); }, { passive: true });
    window.addEventListener('resize', updateReadingMark);
    document.getElementById('document').addEventListener('click', event => {
      if (!event.target.closest('[data-map-start][data-map-end]') || !window.getSelection().isCollapsed) return;
      window.scrollBy({ top: event.clientY - readingY, behavior: 'instant' });
      updateReadingMark();
    });
    function selectionAnchor() {
      const selection = window.getSelection();
      if (!selection || selection.isCollapsed || !document.getElementById('document').contains(selection.anchorNode)) return null;
      const range = selection.getRangeAt(0);
      if (range === syncRange) return null;
      const a = range.startContainer.parentElement?.closest('[data-map-start][data-map-end]');
      const b = range.endContainer.parentElement?.closest('[data-map-start][data-map-end]');
      if (!a || !b) return null;
      if (a.dataset.math || b.dataset.math || a.closest('.display') || b.closest('.display'))
        return { start: Number(a.dataset.mapStart), end: Number(b.dataset.mapEnd), selection: true };
      const offset = (span, node, at) => {
        const r = document.createRange(); r.selectNodeContents(span); r.setEnd(node, at);
        return Number(span.dataset.mapStart) + new TextEncoder().encode(r.toString()).length;
      };
      return { start: offset(a, range.startContainer, range.startOffset), end: offset(b, range.endContainer, range.endOffset), selection: true };
    }
    window.previewReadingAnchor = function() {
      const selection = selectionAnchor();
      if (selection) return selection;
      updateReadingMark();
      if (readingAnchor?.element?.isConnected)
        return { start: readingAnchor.offset, end: readingAnchor.offset, selection: false };
      return null;
    };
    window.highlightPreviewAnchor = function(start, end) {
      const range = rangeFor(start, end);
      const block = [...document.querySelectorAll('[data-source-start]')].find(el => Number(el.dataset.mapStart) <= start && Number(el.dataset.mapEnd) >= start);
      highlight(range, block);
    };
    const lineHeight = () => parseFloat(getComputedStyle(document.body).lineHeight) || 29;
    window.addEventListener('keydown', event => {
      if (event.metaKey || event.altKey || event.target.closest('input,textarea,[contenteditable]')) return;
      if (pendingWindow && event.key !== 'h') pendingWindow = false;
      if (pendingG && event.key !== 'g') pendingG = false;
      const key = event.key;
      if (event.ctrlKey && key.toLowerCase() === 'd') { window.scrollBy({ top: innerHeight * .5, behavior: 'smooth' }); requestAnimationFrame(updateReadingMark); }
      else if (event.ctrlKey && key.toLowerCase() === 'u') { window.scrollBy({ top: -innerHeight * .5, behavior: 'smooth' }); requestAnimationFrame(updateReadingMark); }
      else if (event.ctrlKey && key.toLowerCase() === 'w') { pendingG = false; pendingWindow = true; event.preventDefault(); return; }
      else if (key === 'h' && pendingWindow) { pendingWindow = false; window.location.href = 'draft://focus-source'; }
      else if (!event.ctrlKey && key === 'j') moveReading(1);
      else if (!event.ctrlKey && key === 'k') moveReading(-1);
      else if (!event.ctrlKey && key === 'g') { if (pendingG) { jumpReading(false); pendingG = false; } else pendingG = true; }
      else if (!event.ctrlKey && key === 'G') jumpReading(true);
      else if (event.ctrlKey && key.toLowerCase() === 'g') window.location.href = 'draft://sync';
      else return;
      event.preventDefault();
    });
    let pendingWindow = false;

    window.updateSource = function(nextSource) {
      source = nextSource;
      render();
    };

    window.addEventListener('load', render);
  </script>
</body>
</html>
