<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      max-width: 760px;
      margin: 0 auto;
      padding: 56px 48px 96px;
      color: #252525;
      background: #fff;
      font: 17px/1.72 Georgia, "Times New Roman", serif;
      -webkit-font-smoothing: antialiased;
    }
    h1 { margin: 2.2em 0 .8em; font-size: 1.65em; font-weight: 500; }
    h2 { margin: 1.8em 0 .65em; font-size: 1.25em; font-weight: 500; }
    p { margin: 0 0 1em; }
    .display { margin: 1.3em 0; overflow-x: auto; text-align: center; }
    .error { color: #a33; white-space: pre-wrap; }
    [data-source-start] { scroll-margin-block: 42vh; }
    @media (max-width: 600px) { body { padding: 28px 22px 60px; } }
  </style>
</head>
<body>
  <main id="document"></main>
  <script>
    let source = "";
    const escapeHtml = text => text.replace(/[&<>"']/g, char => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    })[char]);

    function render() {
      const lines = source.split('\n');
      const blocks = [];
      let current = null;
      let inDocument = false;
      const flush = () => {
        if (current && current.value.trim()) blocks.push(current);
        current = null;
      };
      for (let index = 0; index < lines.length; index++) {
        const line = lines[index];
        if (/\\begin\{document\}/.test(line)) { inDocument = true; continue; }
        if (/\\end\{document\}/.test(line)) { flush(); break; }
        if (!inDocument && /^\s*\\(?:documentclass|usepackage|title|author|date)\b/.test(line)) continue;
        const heading = line.match(/^\s*\\(section|subsection)\{([^{}]*)\}/);
        if (heading) {
          flush();
          blocks.push({ kind: heading[1], value: heading[2], start: index + 1, end: index + 1 });
          continue;
        }
        if (/\\\[/.test(line)) {
          flush();
          let value = line.replace(/^.*?\\\[/, '');
          let end = index + 1;
          while (!/\\\]/.test(value) && end < lines.length) value += '\n' + lines[end++];
          value = value.replace(/\\\].*$/, '').trim();
          blocks.push({ kind: 'math', value, start: index + 1, end });
          index = end - 1;
          continue;
        }
        if (!line.trim()) { flush(); continue; }
        if (!current) current = { kind: 'paragraph', value: line, start: index + 1, end: index + 1 };
        else { current.value += '\n' + line; current.end = index + 1; }
      }
      flush();
      const html = blocks.map(block => {
        const attr = `data-source-start="${block.start}" data-source-end="${block.end}"`;
        if (block.kind === 'section') return `<h1 ${attr}>${escapeHtml(block.value)}</h1>`;
        if (block.kind === 'subsection') return `<h2 ${attr}>${escapeHtml(block.value)}</h2>`;
        if (block.kind === 'math') {
          try {
            return `<div class="display" ${attr}>${katex.renderToString(block.value, { displayMode: true, throwOnError: false, strict: "ignore" })}</div>`;
          } catch (_) {
            return `<div class="display error" ${attr}>${escapeHtml(block.value)}</div>`;
          }
        }
        const inline = [];
        let paragraph = block.value.replace(/\\texttt\{([^{}]*)\}/g, '$1').replace(/\$([^$\n]+)\$/g, (_, math) => {
          inline.push(math);
          return `@@INLINE${inline.length - 1}@@`;
        });
        paragraph = escapeHtml(paragraph).replace(/\\\\/g, '<br>');
        paragraph = paragraph.replace(/@@INLINE(\d+)@@/g, (_, index) => {
          const math = inline[Number(index)];
          try { return katex.renderToString(math, { throwOnError: false, strict: "ignore" }); }
          catch (_) { return `<span class="error">${escapeHtml(`$${math}$`)}</span>`; }
        });
        return `<p ${attr}>${paragraph}</p>`;
      }).join('\n');
      document.getElementById('document').innerHTML = html;
      document.querySelectorAll('[data-source-start]').forEach(element => {
        element.addEventListener('click', () => {
          const start = element.dataset.sourceStart;
          const end = element.dataset.sourceEnd;
          window.location.href = `draft://clicked?start=${start}&end=${end}`;
        });
      });
    }

    window.sourceToPreview = function(start, end) {
      const blocks = [...document.querySelectorAll('[data-source-start]')];
      if (!blocks.length) return;
      const block = blocks.find(element => Number(element.dataset.sourceStart) <= end && Number(element.dataset.sourceEnd) >= start)
        || blocks.reduce((nearest, element) => Math.abs(Number(element.dataset.sourceStart) - start) < Math.abs(Number(nearest.dataset.sourceStart) - start) ? element : nearest, blocks[0]);
      block.scrollIntoView({ behavior: 'smooth', block: 'center' });
    };

    window.updateSource = function(nextSource) {
      const x = window.scrollX;
      const y = window.scrollY;
      source = nextSource;
      render();
      requestAnimationFrame(() => window.scrollTo(x, y));
    };

    window.addEventListener('load', render);
  </script>
</body>
</html>
