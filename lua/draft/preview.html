<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="katex/katex.min.css">
  <script defer src="katex/katex.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    :root {
      color-scheme: light;
      --background: #fff;
      --foreground: #252525;
      --error: #a33;
      --warning-dot: #ffbd2e;
      --error-dot: #ff5f57;
      --sync-fill: rgba(92, 139, 176, .18);
      --sync-line: rgba(92, 139, 176, .5);
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --background: #1c1c1e;
      --foreground: #e5e5e7;
      --error: #ff9b96;
      --warning-dot: #ffbd2e;
      --error-dot: #ff5f57;
      --sync-fill: rgba(130, 178, 220, .24);
      --sync-line: rgba(130, 178, 220, .65);
    }
    html { background: var(--background); scrollbar-width: none; }
    html::-webkit-scrollbar, body::-webkit-scrollbar { display: none; }
    body {
      max-width: 760px;
      margin: 0 auto;
      padding: max(48px, calc(25vh - 24px)) 48px 75vh;
      color: var(--foreground);
      background: var(--background);
      font: 17px/1.72 Georgia, "Times New Roman", serif;
      -webkit-font-smoothing: antialiased;
    }
    h1 { margin: 2.2em 0 .8em; font-size: 1.65em; font-weight: 500; }
    h2 { margin: 1.8em 0 .65em; font-size: 1.25em; font-weight: 500; }
    p { margin: 0 0 1em; }
    .texttt { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, monospace; font-size: .9em; }
    .display { margin: 1.3em 0; overflow-x: auto; text-align: center; }
    .figure-mode { max-width: 100%; padding: 48px; }
    .tikz-figure { position: relative; max-width: 760px; margin: 0 auto; }
    .tikz-figure svg { display: block; width: 100%; height: auto; max-height: 82vh; margin: 0 auto; }
    .figure-edit { position: absolute; right: 8px; top: 8px; z-index: 2; width: 30px; height: 30px;
      border: 1px solid rgba(128,128,128,.38); border-radius: 5px; background: var(--background);
      color: var(--foreground); font: 20px/1 sans-serif; cursor: pointer; opacity: 0; transition: opacity .12s; }
    .tikz-figure:hover .figure-edit, .figure-edit:focus-visible, .tikz-figure.editing .figure-edit { opacity: .88; }
    .figure-edit:disabled { cursor: default; opacity: 0; }
    .tikz-figure:hover .figure-edit:disabled { opacity: .35; }
    .tikz-figure.editing .figure-edit { background: var(--sync-fill); border-color: var(--sync-line); }
    .tikz-figure.editing [data-draft-node] { cursor: grab; touch-action: none; }
    .tikz-figure.editing [data-draft-node].dragging { cursor: grabbing; }
    .error { color: var(--error); white-space: pre-wrap; }
    #problems { position: fixed; top: 34px; right: 14px; z-index: 10; font: 12px/1.35 -apple-system, BlinkMacSystemFont, sans-serif; }
    #problem-dot { width: 12px; height: 12px; padding: 0; border: 0; border-radius: 50%; background: var(--warning-dot); cursor: pointer; }
    #problems.error #problem-dot { background: var(--error-dot); }
    #problem-detail { display: none; position: absolute; right: 0; top: 18px; min-width: 190px; max-width: 300px; padding: 8px 10px; border: 1px solid rgba(128,128,128,.28); border-radius: 7px; background: var(--background); color: var(--foreground); box-shadow: 0 3px 14px rgba(0,0,0,.12); }
    #problems:hover #problem-detail, #problems:focus-within #problem-detail, #problems.open #problem-detail { display: block; }
    #problem-detail button { display: block; width: 100%; padding: 3px 0; border: 0; background: none; color: inherit; text-align: left; font: inherit; cursor: pointer; }
    [data-source-start] { scroll-margin-block: 42vh; }
    ::highlight(draft-sync) { background: var(--sync-fill); text-decoration: underline; text-decoration-color: var(--sync-line); }
    .sync-target { background: var(--sync-fill); }
    #reading-mark { position: fixed; z-index: 5; top: 25vh; left: 8px; width: 3px; height: 18px; border-radius: 2px; background: var(--sync-line); pointer-events: none; opacity: .7; display: none; }
    @media (max-width: 600px) { body { padding: max(48px, calc(25vh - 24px)) 22px 75vh; } }
  </style>
</head>
<body>
  <div id="reading-mark" aria-hidden="true"></div>
  <div id="problems" hidden><button id="problem-dot" type="button" aria-label="Preview problems" aria-expanded="false"></button><div id="problem-detail"></div></div>
  <main id="document"></main>
  <script>
    let source = "";
    let previousBlocks = [];
    let figureSVG = null;
    let figureError = null;
    let figureRevision = 0;
    let figureChangedtick = null;
    let figureEditMode = false;
    let figureEditError = null;
    let activeFigureDrag = null;
    let pendingFigureEdit = null;
    let highlightTimer;
    let syncRange;
    window.setDraftAppearance = function(mode) {
      document.documentElement.dataset.theme = mode === 'dark' ? 'dark' : 'light';
    };
    const escapeHtml = text => text.replace(/[&<>"']/g, char => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    })[char]);
    const encoder = new TextEncoder();
    const byteLength = text => encoder.encode(text).length;
    const problem = (severity, message, startOffset, endOffset) => ({ severity, source: 'preview', message, startOffset, endOffset });
    function updateProblems(items) {
      currentProblems = items;
      const surface = document.getElementById('problems');
      const detail = document.getElementById('problem-detail');
      const dot = document.getElementById('problem-dot');
      surface.hidden = items.length === 0;
      surface.classList.toggle('error', items.some(item => item.severity === 'error'));
      const open = !!figureError && items.length > 0;
      surface.classList.toggle('open', open);
      dot.setAttribute('aria-expanded', String(open));
      dot.setAttribute('aria-label', items.length ? `${items.length} preview ${items.length === 1 ? 'problem' : 'problems'}` : 'Preview problems');
      detail.replaceChildren();
      if (items.length > 1) {
        const summary = document.createElement('div');
        const errors = items.filter(item => item.severity === 'error').length;
        const warnings = items.length - errors;
        summary.textContent = [errors && `${errors} preview ${errors === 1 ? 'error' : 'errors'}`, warnings && `${warnings} preview ${warnings === 1 ? 'warning' : 'warnings'}`].filter(Boolean).join(' · ');
        detail.append(summary);
      }
      for (const item of items.slice(0, 5)) {
        const row = document.createElement('button');
        row.type = 'button';
        row.textContent = item.message;
        row.addEventListener('click', () => copyDiagnostics([item], row));
        detail.append(row);
      }
    }
    document.getElementById('problem-dot').addEventListener('click', () => {
      copyDiagnostics(currentProblems, document.getElementById('problem-dot'));
      const surface = document.getElementById('problems');
      surface.classList.toggle('open');
      document.getElementById('problem-dot').setAttribute('aria-expanded', String(surface.classList.contains('open')));
    });
    let macros = new Map();
    let currentProblems = [];
    function group(text, start) {
      if (text[start] !== '{') return null;
      let depth = 1;
      for (let i = start + 1; i < text.length; i++) {
        if (text[i] === '\\') { i++; continue; }
        if (text[i] === '{') depth++;
        if (text[i] === '}' && --depth === 0) return { value: text.slice(start + 1, i), end: i + 1 };
      }
      return null;
    }
    // Declarations are global to this preview; masking preserves original UTF-8 offsets.
    function prepare(text) {
      macros = new Map();
      let out = '', cursor = 0;
      const token = /\\(newcommand|renewcommand|DeclareMathOperator)\*?|\\(usepackage|documentclass)\b/g;
      let match;
      while ((match = token.exec(text))) {
        let i = token.lastIndex;
        const space = () => { while (/\s/.test(text[i] || '') && i < text.length) i++; };
        space();
        if (match[2] && text[i] === '[') { const end = text.indexOf(']', i); if (end >= 0) i = end + 1; space(); }
        let name = group(text, i);
        if (!name && match[1]) { const bare = /^\\[A-Za-z@]+/.exec(text.slice(i)); if (bare) name = {value: bare[0], end: i + bare[0].length}; }
        if (!name) continue;
        i = name.end; space();
        let count = 0;
        if (match[1] && text[i] === '[') {
          const args = /^\[(\d+)\]/.exec(text.slice(i));
          if (!args || Number(args[1]) > 9) continue;
          count = Number(args[1]); i += args[0].length; space();
        }
        const body = match[1] ? group(text, i) : name;
        if (!body) continue;
        const end = match[1] ? body.end : name.end;
        if (match[1] && /^\\[A-Za-z@]+$/.test(name.value)) macros.set(name.value, {count, body: match[1] === 'DeclareMathOperator' ? `\\operatorname{${body.value}}` : body.value});
        out += text.slice(cursor, match.index) + text.slice(match.index, end).replace(/[^\n]/g, char => ' '.repeat(byteLength(char)));
        cursor = end; token.lastIndex = end;
      }
      return out + text.slice(cursor);
    }
    function expandMacros(text, items, offset, depth = 0, active = new Set(), budget = {remaining: 100000}) {
      if (depth >= 16 || text.length > budget.remaining) {
        items.push(problem('warning', 'Preview macro expansion limit reached', offset, offset + byteLength(text)));
        return text;
      }
      budget.remaining -= text.length;
      let out = '', cursor = 0, match;
      const token = /\\[A-Za-z@]+/g;
      while ((match = token.exec(text))) {
        const macro = macros.get(match[0]); if (!macro) continue;
        let end = token.lastIndex, args = [];
        for (let n = 0; n < macro.count; n++) {
          while (/\s/.test(text[end] || '') && end < text.length) end++;
          const arg = group(text, end); if (!arg) break;
          args.push(arg.value); end = arg.end;
        }
        if (args.length !== macro.count) continue;
        if (active.has(match[0])) {
          items.push(problem('warning', 'Recursive preview macro ' + match[0], offset, offset + byteLength(text)));
          continue;
        }
        const body = macro.body.replace(/#([1-9])/g, (_, n) => args[Number(n) - 1] ?? '#' + n);
        out += text.slice(cursor, match.index) + expandMacros(body, items, offset + byteLength(text.slice(0, match.index)), depth + 1, new Set([...active, match[0]]), budget);
        cursor = end; token.lastIndex = end;
        if (out.length > 100000) { items.push(problem('warning', 'Preview macro expansion limit reached', offset, offset + byteLength(text))); return text; }
      }
      return out + text.slice(cursor);
    }
    function diagnosticText(item) {
      const prefix = source.slice(0, utf16AtByte(source, item.startOffset));
      const line = prefix.split('\n').length;
      return `${item.message}\nline ${line}: ${source.split('\n')[line - 1] || ''}`;
    }
    async function copyDiagnostics(items, button) {
      const text = items.map(diagnosticText).join('\n\n');
      try {
        let copied = false;
        if (navigator.clipboard?.writeText) {
          try { await navigator.clipboard.writeText(text); copied = true; } catch (_) {}
        }
        if (!copied) {
          const selection = window.getSelection();
          const ranges = Array.from({length: selection.rangeCount}, (_, i) => selection.getRangeAt(i).cloneRange());
          const focused = document.activeElement;
          const field = document.createElement('textarea'); field.value = text;
          field.style.cssText = 'position:fixed;opacity:0'; document.body.append(field);
          field.select(); const copied = document.execCommand('copy'); field.remove();
          focused?.focus({preventScroll: true});
          selection.removeAllRanges(); ranges.forEach(range => selection.addRange(range));
          if (!copied) throw Error('Clipboard unavailable');
        }
        const label = button.getAttribute('aria-label');
        button.setAttribute('aria-label', 'Copied'); button.title = 'Copied';
        button.style.opacity = '.45';
        setTimeout(() => { button.style.opacity = ''; button.title = ''; if (label) button.setAttribute('aria-label', label); else button.removeAttribute('aria-label'); }, 900);
      } catch (_) { button.title = 'Could not copy diagnostic'; }
    }

    function parse() {
      const lines = prepare(source).split('\n');
      const lineOffsets = [];
      let total = 0;
      for (const line of lines) { lineOffsets.push(total); total += byteLength(line) + 1; }
      const blocks = [];
      let current = null;
      let inDocument = false;
      const flush = () => {
        if (current && current.value.trim()) blocks.push(current);
        current = null;
      };
      for (let index = 0; index < lines.length; index++) {
        const line = lines[index];
        if (/\\begin\{document\}/.test(line)) { inDocument = true; continue; }
        if (/\\end\{document\}/.test(line)) { flush(); break; }
        if (!inDocument && /^\s*\\(?:documentclass|usepackage|title|author|date)\b/.test(line)) continue;
        const environment = line.match(/^\s*\\begin\{(itemize|enumerate|quote|center)\}/);
        if (environment) {
          flush();
          let depth = 0, end = index, content = '';
          for (; end < lines.length; end++) {
            const row = lines[end];
            const tokens = [...row.matchAll(/\\(begin|end)\{(itemize|enumerate|quote|center)\}/g)];
            for (const token of tokens) depth += token[1] === 'begin' ? 1 : -1;
            content += (end === index ? '' : '\n') + row;
            if (depth === 0) break;
          }
          end = Math.min(end, lines.length - 1);
          blocks.push({kind: environment[1], value: content, start: index + 1, end: end + 1,
            startOffset: lineOffsets[index], endOffset: lineOffsets[end] + byteLength(lines[end])});
          index = end; continue;
        }
        const heading = line.match(/^\s*\\(section|subsection)\{([^{}]*)\}/);
        if (heading) {
          flush();
          const content = line.indexOf(heading[2]);
          blocks.push({ kind: heading[1], value: heading[2], start: index + 1, end: index + 1,
            startOffset: lineOffsets[index] + new TextEncoder().encode(line.slice(0, content)).length,
            endOffset: lineOffsets[index] + new TextEncoder().encode(line.slice(0, content + heading[2].length)).length });
          continue;
        }
        const displayEnvironment = line.match(/^\s*\\begin\{(equation\*?|align\*?|gather\*?|multline\*?)\}/);
        if (/\\\[/.test(line) || displayEnvironment) {
          flush();
          const environment = displayEnvironment && displayEnvironment[1];
          let value = displayEnvironment
            ? line.replace(/^.*?\\begin\{[^}]+\}/, '')
            : line.replace(/^.*?\\\[/, '');
          let end = index + 1;
          const closing = environment ? new RegExp(`\\\\end\\{${environment.replace('*', '\\*')}\\}`) : /\\\]/;
          while (!closing.test(value) && end < lines.length) value += '\n' + lines[end++];
          value = value.replace(environment ? new RegExp(`\\\\end\\{${environment.replace('*', '\\*')}\\}.*$`) : /\\\].*$/, '').trim();
          blocks.push({ kind: 'math', value, start: index + 1, end,
            startOffset: lineOffsets[index], endOffset: lineOffsets[Math.min(end - 1, lines.length - 1)] + new TextEncoder().encode(lines[Math.min(end - 1, lines.length - 1)]).length });
          index = end - 1;
          continue;
        }
        if (!line.trim()) { flush(); continue; }
        if (!current) current = { kind: 'paragraph', value: line, parts: [{ text: line, offset: lineOffsets[index] }], start: index + 1, end: index + 1, startOffset: lineOffsets[index], endOffset: lineOffsets[index] + byteLength(line) };
        else { current.value += '\n' + line; current.parts.push({ text: line, offset: lineOffsets[index] }); current.end = index + 1; current.endOffset = lineOffsets[index] + byteLength(line); }
      }
      flush();
      return blocks;
    }

    function renderBlock(block, items) {
      const attr = `data-source-start="${block.start}" data-source-end="${block.end}" data-map-start="${block.startOffset}" data-map-end="${block.endOffset}"`;
      const mapped = (text, offset) => text
        ? `<span data-map-start="${offset}" data-map-end="${offset + new TextEncoder().encode(text).length}">${escapeHtml(text)}</span>`
        : '';
      if (block.kind === 'section') return `<h1 ${attr}>${inline(block.value, block.startOffset)}</h1>`;
      if (block.kind === 'subsection') return `<h2 ${attr}>${inline(block.value, block.startOffset)}</h2>`;
      if (block.kind === 'math') {
        try {
          return `<div class="display" ${attr}>${katex.renderToString(expandMacros(block.value, items, block.startOffset), { displayMode: true, throwOnError: true, strict: "ignore" })}</div>`;
        } catch (_) {
          items.push(problem('error', 'Preview could not render a display equation', block.startOffset, block.endOffset));
          return `<div class="display error" ${attr}>${escapeHtml(block.value)}</div>`;
        }
      }
      function inline(text, offset, expandedText = false) {
        const mappedText = (value, start) => mapped(value, start);
        let out = '', i = 0;
        while (i < text.length) {
          const start = offset + byteLength(text.slice(0, i));
          const math = /^(?:\$([^$\n]+)\$|\\\(([\s\S]*?)\\\))/.exec(text.slice(i));
          if (math) {
            const value = expandMacros(math[1] ?? math[2], items, start);
            try { out += `<span data-map-start="${start}" data-map-end="${start + byteLength(math[0])}" data-math="true">${katex.renderToString(value, {throwOnError: true, strict: 'ignore'})}</span>`; }
            catch (error) { items.push(problem('error', error.message || 'Preview could not render an inline equation', start, start + byteLength(math[0]))); out += mappedText(math[0], start); }
            i += math[0].length; continue;
          }
          const command = /^\\([A-Za-z@]+)\*?/.exec(text.slice(i));
          if (command) {
            let end = i + command[0].length;
            const macro = macros.get(command[0]);
            if (macro && !expandedText) {
              for (let n = 0; n < macro.count; n++) { while (/\s/.test(text[end] || '') && end < text.length) end++; const arg = group(text, end); if (!arg) break; end = arg.end; }
              const original = text.slice(i, end), expanded = expandMacros(original, items, start);
              // Expanded text is atomic for synchronization; its length is not source length.
              out += `<span data-map-start="${start}" data-map-end="${offset + byteLength(text.slice(0, end))}" data-math="true">${inline(expanded, start, true).replace(/ data-(?:map-start|map-end|inline-command|math)="[^"]*"/g, "")}</span>`;
              i = end; continue;
            }
            while (/\s/.test(text[end] || '') && end < text.length) end++;
            const arg = group(text, end);
            if (arg) {
              if (['begin', 'end'].includes(command[1])) items.push(problem('warning', `Unsupported preview environment ${arg.value}`, start, start + byteLength(command[0]) + byteLength(arg.value) + 2));
              let body = inline(arg.value, offset + byteLength(text.slice(0, end + 1)), expandedText);
              let linkTarget = null;
              let tag = {textbf:'strong', textit:'em', emph:'em', texttt:'code'}[command[1]] || 'span';
              if (command[1] === 'url') { tag = 'a'; linkTarget = arg.value; }
              if (command[1] === 'href') {
                const second = group(text, arg.end); if (second) { body = inline(second.value, offset + byteLength(text.slice(0, arg.end + 1)), expandedText); end = second.end; tag = 'a'; linkTarget = arg.value; }
                else end = arg.end;
              } else end = arg.end;
              let href = '';
              if (tag === 'a' && linkTarget) {
                if (/^https?:\/\//i.test(linkTarget)) href = ` href="${escapeHtml(linkTarget)}"`;
                else if (/^#[A-Za-z0-9_][\w:.-]*$/.test(linkTarget)) href = ` href="${escapeHtml(linkTarget)}"`;
                else if (!/^(?:\/\/|[A-Za-z][A-Za-z0-9+.-]*:)/.test(linkTarget) && /^[^?#]+\.tex(?:#[A-Za-z0-9_][\w:.-]*)?$/i.test(linkTarget))
                  href = ` href="draft://open?target=${encodeURIComponent(linkTarget)}&start=${start}"`;
              }
              if (command[1] === 'label' && /^[A-Za-z0-9_][\w:.-]*$/.test(arg.value)) {
                out += `<span id="${escapeHtml(arg.value)}" style="display:inline-block;width:0;height:1px;scroll-margin-top:35vh" data-map-start="${start}" data-map-end="${offset + byteLength(text.slice(0, end))}"></span>`;
              } else {
                out += `<${tag}${href} class="${command[1] === 'texttt' ? 'texttt' : ''}" data-inline-command="true" data-map-start="${start}" data-map-end="${offset + byteLength(text.slice(0, end))}">${body}</${tag}>`;
              }
              i = end; continue;
            }
            items.push(problem('warning', `Unsupported preview command ${command[0]}`, start, start + byteLength(command[0])));
            out += mappedText(command[0], start); i += command[0].length; continue;
          }
          if (text.slice(i, i + 2) === '\\\\') { out += '<br>'; i += 2; continue; }
          let end = i + 1; while (end < text.length && !['\\', '$'].includes(text[end])) end++;
          out += mappedText(text.slice(i, end), start); i = end;
        }
        return out;
      }
      if (['itemize', 'enumerate', 'quote', 'center'].includes(block.kind)) {
        const token = /\\(begin|end)\{(itemize|enumerate|quote|center)\}|\\item\b(?:\[([^\]]*)\])?/g;
        let out = '', cursor = 0, stack = [], match;
        while ((match = token.exec(block.value))) {
          out += inline(block.value.slice(cursor, match.index), block.startOffset + byteLength(block.value.slice(0, cursor)));
          if (match[1] === 'begin') {
            const tag = {itemize:'ul', enumerate:'ol', quote:'blockquote', center:'div'}[match[2]];
            stack.push({tag, item:false}); out += `<${tag}${match[2] === 'center' ? ' style="text-align:center"' : ''}>`;
          } else if (match[1] === 'end') {
            const entry = stack.pop(); if (entry) out += (entry.item ? '</li>' : '') + `</${entry.tag}>`;
          } else {
            const entry = stack[stack.length - 1];
            if (entry && ['ul','ol'].includes(entry.tag)) { out += (entry.item ? '</li>' : '') + '<li>'; entry.item = true; if (match[3]) out += inline(match[3], block.startOffset + byteLength(block.value.slice(0, match.index))); }
            else out += inline(match[0], block.startOffset + byteLength(block.value.slice(0, match.index)));
          }
          cursor = token.lastIndex;
        }
        out += inline(block.value.slice(cursor), block.startOffset + byteLength(block.value.slice(0, cursor)));
        if (stack.length) items.push(problem('warning', 'Unclosed preview environment', block.startOffset, block.endOffset));
        while (stack.length) { const entry = stack.pop(); out += (entry.item ? '</li>' : '') + `</${entry.tag}>`; }
        return `<div ${attr}>${out}</div>`;
      }
      const body = block.parts.map(part => inline(part.text, part.offset)).join('<br>');
      return `<p ${attr}>${body}</p>`;
    }

    function render() {
      const root = document.getElementById('document');
      const items = [];
      const standaloneFigure = /\\begin\s*\{tikzpicture\*?\}/.test(source)
        && (/\\documentclass\s*(?:\[[^\]]*\]\s*)?\{standalone\}/.test(source) || !/\\begin\s*\{document\}/.test(source));
      if (standaloneFigure) {
        document.body.classList.add('figure-mode');
        if (!figureSVG) root.replaceChildren();
        if (figureSVG) {
          const revision = ++figureRevision;
          const currentSVG = figureSVG;
          const parsed = new DOMParser().parseFromString(figureSVG, 'image/svg+xml');
          const svg = parsed.documentElement;
          if (svg.localName === 'svg' && !parsed.querySelector('parsererror')) {
            const figure = document.createElement('div');
            figure.className = 'tikz-figure';
            const imported = document.importNode(svg, true);
            imported.dataset.texPtPerUnit = String(72.27 / 72);
            for (const marker of [...imported.querySelectorAll('g[data-draft-node]')]) {
              if (marker.parentElement !== imported || marker.hasAttribute('transform')) continue;
              const name = marker.dataset.draftNode;
              const wrapper = document.createElementNS('http://www.w3.org/2000/svg', 'g');
              wrapper.dataset.draftNode = name;
              wrapper.dataset.draftXshift = marker.dataset.draftXshift;
              wrapper.dataset.draftYshift = marker.dataset.draftYshift;
              imported.insertBefore(wrapper, marker);
              wrapper.append(marker);
              marker.removeAttribute('data-draft-node');
            }
            figure.append(imported);
            const edit = document.createElement('button');
            edit.type = 'button';
            edit.className = 'figure-edit';
            edit.textContent = '✎';
            edit.setAttribute('aria-label', 'Edit figure');
            const canEdit = Boolean(imported.querySelector('[data-draft-node]')) && Number.isSafeInteger(figureChangedtick);
            edit.disabled = !canEdit;
            edit.title = canEdit ? 'Edit named TikZ nodes' : 'Direct editing requires named TikZ nodes with numeric xshift and yshift';
            if (!canEdit) figureEditMode = false;
            figure.classList.toggle('editing', figureEditMode);
            edit.setAttribute('aria-pressed', String(figureEditMode));
            edit.addEventListener('click', () => {
              figureEditMode = !figureEditMode;
              figure.classList.toggle('editing', figureEditMode);
              edit.setAttribute('aria-pressed', String(figureEditMode));
            });
            figure.append(edit);
            // WebKit captures feImage group inputs before their PNG shading
            // finishes decoding, then fails to repaint the filter when it loads.
            const images = [...imported.querySelectorAll('image')].map(element => {
              const image = new Image();
              image.src = element.getAttribute('href') || element.getAttributeNS('http://www.w3.org/1999/xlink', 'href');
              return image.decode();
            });
            const install = () => {
              if (revision === figureRevision && figureSVG === currentSVG) root.replaceChildren(figure);
            };
            if (images.length) Promise.all(images).then(install).catch(error => {
              if (revision !== figureRevision || figureSVG !== currentSVG) return;
              figureError = `SVG image could not decode: ${error.message}`;
              updateProblems([problem('error', figureError, 0, byteLength(source))]);
            });
            else install();
          }
        }
        if (!figureSVG && !figureError) root.textContent = 'Compiling TikZ figure…';
        if (figureError) items.push(problem('error', `TikZ preview: ${figureError}`, 0, byteLength(source)));
        if (figureEditError) items.push(problem('warning', `Label edit rejected: ${figureEditError}`, 0, byteLength(source)));
        updateProblems(items);
        updateReadingMark();
        return;
      }
      document.body.classList.remove('figure-mode');
      figureSVG = null;
      figureError = null;
      const oldNodes = new Map();
      for (const block of previousBlocks) {
        const key = block.key;
        const nodes = oldNodes.get(key) || [];
        nodes.push(block);
        oldNodes.set(key, nodes);
      }
      let blocks;
      try { blocks = parse(); }
      catch (_) {
        previousBlocks = [];
        root.textContent = source;
        updateProblems([problem('error', 'Preview could not parse this source', 0, byteLength(source))]);
        return;
      }
      const macroKey = JSON.stringify([...macros]);
      let cursor = root.firstChild;
      for (const block of blocks) {
        const key = `${block.kind}\0${block.value}\0${macroKey}`;
        block.key = key;
        const reusable = oldNodes.get(key);
        const prior = reusable && reusable.length ? reusable.shift() : null;
        let element = prior?.element || null;
        if (!element) {
          const template = document.createElement('template');
          const before = items.length;
          try { template.innerHTML = renderBlock(block, items); }
          catch (_) {
            items.push(problem('error', 'Preview could not render this block', block.startOffset, block.endOffset));
            template.innerHTML = `<p class="error" data-source-start="${block.start}" data-source-end="${block.end}" data-map-start="${block.startOffset}" data-map-end="${block.endOffset}">${escapeHtml(block.value)}</p>`;
          }
          block.errors = items.slice(before);
          element = template.content.firstElementChild;
        } else {
          block.errors = (prior.errors || []).map(item => ({ ...item,
            startOffset: item.startOffset + block.startOffset - prior.startOffset,
            endOffset: item.endOffset + block.startOffset - prior.startOffset }));
          items.push(...block.errors);
          const offsetShift = block.startOffset - Number(element.dataset.mapStart);
          if (offsetShift !== 0) {
            element.querySelectorAll('[data-map-start], [data-map-end]').forEach(mapped => {
              if (mapped.dataset.mapStart !== undefined) mapped.dataset.mapStart = Number(mapped.dataset.mapStart) + offsetShift;
              if (mapped.dataset.mapEnd !== undefined) mapped.dataset.mapEnd = Number(mapped.dataset.mapEnd) + offsetShift;
            });
          }
        }
        element.dataset.sourceStart = block.start;
        element.dataset.sourceEnd = block.end;
        element.dataset.mapStart = block.startOffset;
        element.dataset.mapEnd = block.endOffset;
        block.element = element;
        if (element !== cursor) root.insertBefore(element, cursor);
        cursor = element.nextSibling;
      }
      while (cursor) {
        const next = cursor.nextSibling;
        root.removeChild(cursor);
        cursor = next;
      }
      previousBlocks = blocks;
      updateProblems(items);
      updateReadingMark();
    }

    function clearSync() {
      if (window.CSS && CSS.highlights) CSS.highlights.delete('draft-sync');
      const selection = window.getSelection();
      if (syncRange && selection.rangeCount && selection.getRangeAt(0) === syncRange) selection.removeAllRanges();
      document.querySelectorAll('.sync-target').forEach(element => element.classList.remove('sync-target'));
      syncRange = null;
    }

    function highlight(range, fallback) {
      clearTimeout(highlightTimer);
      clearSync();
      if (range) {
        syncRange = range;
        if (window.CSS && CSS.highlights && window.Highlight) CSS.highlights.set('draft-sync', new Highlight(range));
        const selection = window.getSelection();
        selection.removeAllRanges();
        selection.addRange(range);
      } else if (fallback) fallback.classList.add('sync-target');
      highlightTimer = setTimeout(clearSync, 1800);
    }

    function utf16AtByte(text, byteOffset) {
      let bytes = 0;
      for (let i = 0; i < text.length;) {
        const cp = text.codePointAt(i), chars = cp > 0xffff ? 2 : 1;
        const size = new TextEncoder().encode(String.fromCodePoint(cp)).length;
        if (bytes + size > byteOffset) return i;
        bytes += size; i += chars;
      }
      return text.length;
    }

    function pointAt(offset, endPoint = false) {
      const contains = el => endPoint
        ? Number(el.dataset.mapStart) < offset && offset <= Number(el.dataset.mapEnd)
        : Number(el.dataset.mapStart) <= offset && offset < Number(el.dataset.mapEnd);
      // Command wrappers include invisible source syntax; only their mapped text
      // children have a one-to-one byte correspondence with rendered text.
      const spans = [...document.querySelectorAll('span[data-map-start][data-map-end]')].filter(el => !el.dataset.math && !el.dataset.inlineCommand);
      const span = spans.find(contains);
      if (!span) {
        const command = [...document.querySelectorAll('[data-inline-command]')].find(contains);
        const inner = command?.querySelector('span[data-map-start]');
        if (inner) {
          const first = Number(inner.dataset.mapStart), last = Number(inner.dataset.mapEnd);
          if (offset <= first) return pointAt(first);
          if (offset >= last) return pointAt(last, true);
        }
        const math = [...document.querySelectorAll('[data-math="true"]')].find(contains);
        if (!math || !math.parentNode) return null;
        const index = [...math.parentNode.childNodes].indexOf(math);
        return [math.parentNode, index + (endPoint ? 1 : 0)];
      }
      const walker = document.createTreeWalker(span, NodeFilter.SHOW_TEXT);
      let node, left = offset - Number(span.dataset.mapStart);
      while ((node = walker.nextNode())) {
        const length = new TextEncoder().encode(node.nodeValue).length;
        if (left <= length) return [node, utf16AtByte(node.nodeValue, left)];
        left -= length;
      }
      return null;
    }

    function rangeFor(start, end) {
      const a = pointAt(start), b = pointAt(end, true);
      if (!a || !b) return null;
      const range = document.createRange();
      range.setStart(a[0], a[1]); range.setEnd(b[0], b[1]);
      return range;
    }

    window.sourceToPreview = function(start, end, mode) {
      const blocks = [...document.querySelectorAll('[data-source-start]')];
      if (!blocks.length) return;
      let block = blocks.find(el => Number(el.dataset.mapStart) <= start && Number(el.dataset.mapEnd) >= start);
      if (!block) block = blocks.reduce((nearest, el) => Math.abs(Number(el.dataset.mapStart) - start) < Math.abs(Number(nearest.dataset.mapStart) - start) ? el : nearest, blocks[0]);
      const show = (range, fallback) => {
        highlight(range, fallback);
        const rect = range?.getBoundingClientRect() || fallback?.getBoundingClientRect();
        if (rect) window.scrollBy({ top: rect.top - readingY, behavior: 'smooth' });
      };
      if (mode === 'cursor') {
        const math = [...block.querySelectorAll('[data-math="true"]')].find(el => Number(el.dataset.mapStart) <= start && Number(el.dataset.mapEnd) >= start);
        if (math) { show(null, math); return; }
        const inline = [...block.querySelectorAll('[data-inline-command]')]
          .filter(el => Number(el.dataset.mapStart) <= start && start < Number(el.dataset.mapEnd))
          .sort((a, b) => (Number(a.dataset.mapEnd) - Number(a.dataset.mapStart)) - (Number(b.dataset.mapEnd) - Number(b.dataset.mapStart)))[0];
        if (inline) {
          const inner = inline.querySelector('span[data-map-start]');
          if (inner) { show(rangeFor(Number(inner.dataset.mapStart), Number(inner.dataset.mapEnd)), inner); return; }
        }
      }
      if (block.classList.contains('display')) { show(null, block); return; }
      const range = rangeFor(start, end);
      show(range, block);
    };

    document.getElementById('document').addEventListener('mousedown', () => {
      clearTimeout(highlightTimer);
      if (window.CSS && CSS.highlights) CSS.highlights.delete('draft-sync');
      syncRange = null;
    });

    let readingY = innerHeight * .25;
    let readingAnchor = null;
    let pendingG = false;
    function readingAt(y) {
      const doc = document.getElementById('document');
      const x = Math.min(innerWidth - 24, Math.max(24, doc.getBoundingClientRect().left + 30));
      let range = document.caretRangeFromPoint?.(x, Math.max(0, Math.min(innerHeight - 18, y)));
      let element = range?.startContainer?.parentElement?.closest('[data-map-start][data-map-end]');
      const visible = element?.getBoundingClientRect();
      if (!element || !doc.contains(element) || visible.bottom < 0 || visible.top > innerHeight) {
        element = nearestAnchor(y);
        range = null;
      }
      if (!element) return null;
      if (element.dataset.inlineCommand) element = element.querySelector('span[data-map-start]') || element;
      const rect = range?.getBoundingClientRect();
      const block = element.closest('[data-source-start]') || element;
      const lineY = rect && rect.height ? rect.top : element.getBoundingClientRect().top;
      const lineRange = document.caretRangeFromPoint?.(x, Math.max(0, Math.min(innerHeight - 18, lineY + 8)));
      const lineElement = lineRange?.startContainer?.parentElement?.closest('[data-map-start][data-map-end]');
      const chosen = lineElement && block.contains(lineElement) ? lineElement : element;
      const chosenRange = lineElement && block.contains(lineElement) ? lineRange : range;
      let offset = Number(chosen.dataset.mapStart);
      if (chosenRange && chosen.contains(chosenRange.startContainer) && !chosen.dataset.math && !chosen.closest('.display')) {
        const prefix = document.createRange();
        prefix.selectNodeContents(chosen);
        prefix.setEnd(chosenRange.startContainer, chosenRange.startOffset);
        offset += byteLength(prefix.toString());
      }
      return { element: chosen, y: lineY, offset };
    }
    function updateReadingMark() {
      readingY = innerHeight * .25;
      const mark = document.getElementById('reading-mark');
      const current = readingAt(readingY);
      if (!current) { mark.style.display = 'none'; delete mark.dataset.sourceOffset; readingAnchor = null; return; }
      readingAnchor = current;
      mark.dataset.sourceOffset = current.offset;
      mark.style.display = 'block';
    }
    function moveReading(lines) {
      window.scrollBy({ top: lines * lineHeight(), behavior: 'smooth' });
      requestAnimationFrame(updateReadingMark);
    }
    function nearestAnchor(y = readingY) {
      let nearest = null, distance = Infinity;
      for (const element of document.querySelectorAll('[data-map-start][data-map-end]')) {
        const rect = element.getBoundingClientRect();
        if (rect.bottom < 0 || rect.top > innerHeight) continue;
        const gap = Math.max(rect.top - y, y - rect.bottom, 0);
        if (gap < distance || (gap === distance && nearest?.contains(element))) {
          nearest = element; distance = gap;
        }
      }
      return nearest;
    }
    function jumpReading(last) {
      const positions = [...document.querySelectorAll('[data-source-start]')];
      const element = last ? positions.at(-1) : positions[0];
      if (!element) return;
      const rect = element.getBoundingClientRect();
      const y = last ? rect.bottom - lineHeight() : rect.top;
      window.scrollBy({ top: y - readingY, behavior: 'instant' });
      updateReadingMark();
    }
    window.addEventListener('scroll', () => { requestAnimationFrame(updateReadingMark); }, { passive: true });
    window.addEventListener('resize', updateReadingMark);
    document.getElementById('document').addEventListener('click', event => {
      if (!event.target.closest('[data-map-start][data-map-end]') || !window.getSelection().isCollapsed) return;
      window.scrollBy({ top: event.clientY - readingY, behavior: 'instant' });
      updateReadingMark();
    });
    function selectionAnchor() {
      const selection = window.getSelection();
      if (!selection || selection.isCollapsed || !document.getElementById('document').contains(selection.anchorNode)) return null;
      const range = selection.getRangeAt(0);
      if (range === syncRange) return null;
      const a = range.startContainer.parentElement?.closest('[data-map-start][data-map-end]');
      const b = range.endContainer.parentElement?.closest('[data-map-start][data-map-end]');
      if (!a || !b) return null;
      if (a.dataset.math || b.dataset.math || a.closest('.display') || b.closest('.display'))
        return { start: Number(a.dataset.mapStart), end: Number(b.dataset.mapEnd), selection: true };
      const offset = (span, node, at) => {
        const r = document.createRange(); r.selectNodeContents(span); r.setEnd(node, at);
        return Number(span.dataset.mapStart) + new TextEncoder().encode(r.toString()).length;
      };
      return { start: offset(a, range.startContainer, range.startOffset), end: offset(b, range.endContainer, range.endOffset), selection: true };
    }
    window.previewReadingAnchor = function() {
      const selection = selectionAnchor();
      if (selection) return selection;
      updateReadingMark();
      if (readingAnchor?.element?.isConnected)
        return { start: readingAnchor.offset, end: readingAnchor.offset, selection: false };
      return null;
    };
    window.highlightPreviewAnchor = function(start, end) {
      const range = rangeFor(start, end);
      const block = [...document.querySelectorAll('[data-source-start]')].find(el => Number(el.dataset.mapStart) <= start && Number(el.dataset.mapEnd) >= start);
      highlight(range, block);
    };
    const lineHeight = () => parseFloat(getComputedStyle(document.body).lineHeight) || 29;
    window.addEventListener('keydown', event => {
      if (event.metaKey || event.altKey || event.target.closest('input,textarea,[contenteditable]')) return;
      if (pendingWindow && event.key !== 'h') pendingWindow = false;
      if (pendingG && event.key !== 'g') pendingG = false;
      const key = event.key;
      if (event.ctrlKey && key.toLowerCase() === 'd') { window.scrollBy({ top: innerHeight * .5, behavior: 'smooth' }); requestAnimationFrame(updateReadingMark); }
      else if (event.ctrlKey && key.toLowerCase() === 'u') { window.scrollBy({ top: -innerHeight * .5, behavior: 'smooth' }); requestAnimationFrame(updateReadingMark); }
      else if (event.ctrlKey && key.toLowerCase() === 'w') { pendingG = false; pendingWindow = true; event.preventDefault(); return; }
      else if (key === 'h' && pendingWindow) { pendingWindow = false; window.location.href = 'draft://focus-source'; }
      else if (!event.ctrlKey && key === 'j') moveReading(1);
      else if (!event.ctrlKey && key === 'k') moveReading(-1);
      else if (!event.ctrlKey && key === 'g') { if (pendingG) { jumpReading(false); pendingG = false; } else pendingG = true; }
      else if (!event.ctrlKey && key === 'G') jumpReading(true);
      else if (event.ctrlKey && key.toLowerCase() === 'g') window.location.href = 'draft://sync';
      else return;
      event.preventDefault();
    });
    let pendingWindow = false;

    const documentScrollPositions = new Map();
    let currentDocumentPath = null;
    window.updateSource = function(nextSource, nextPath) {
      const changingDocument = currentDocumentPath !== null && nextPath && currentDocumentPath !== nextPath;
      if (nextSource === source && (!nextPath || nextPath === currentDocumentPath)) return;
      if (changingDocument) {
        documentScrollPositions.set(currentDocumentPath, window.scrollY);
        figureEditMode = false;
      }
      currentDocumentPath = nextPath || currentDocumentPath;
      source = nextSource;
      const standaloneFigure = /\\begin\s*\{tikzpicture\*?\}/.test(source)
        && (/\\documentclass\s*(?:\[[^\]]*\]\s*)?\{standalone\}/.test(source) || !/\\begin\s*\{document\}/.test(source));
      if (!changingDocument && standaloneFigure && document.querySelector('.tikz-figure svg')) return;
      render();
      if (changingDocument) requestAnimationFrame(() => window.scrollTo(0, documentScrollPositions.get(currentDocumentPath) || 0));
    };

    function dragPoint(svg, x, y) {
      const matrix = svg.getScreenCTM();
      if (!matrix) return null;
      const point = svg.createSVGPoint();
      point.x = x; point.y = y;
      const local = point.matrixTransform(matrix.inverse());
      return {x: local.x, y: local.y};
    }
    function texDisplacement(dx, dy, scale) { return {x: dx * scale, y: -dy * scale}; }
    function shiftAfterDrag(baseX, baseY, dx, dy) {
      return {x: Number((baseX + dx).toFixed(3)), y: Number((baseY + dy).toFixed(3))};
    }
    window.draftFigureDragPoint = dragPoint;
    window.draftFigureTexDisplacement = texDisplacement;
    window.draftFigureShiftAfterDrag = shiftAfterDrag;
    function restoreDrag(drag) {
      for (const [group, transform] of drag.transforms) {
        if (transform == null) group.removeAttribute('transform');
        else group.setAttribute('transform', transform);
        group.classList.remove('dragging');
      }
    }
    function placeDrag(drag, x, y) {
      const point = dragPoint(drag.svg, x, y);
      if (!point) return null;
      const dx = point.x - drag.origin.x, dy = point.y - drag.origin.y;
      if (Math.hypot(x - drag.startX, y - drag.startY) < 2) return {dx, dy, moved: false};
      drag.moved = true;
      for (const group of drag.groups) group.setAttribute('transform', `translate(${dx} ${dy})`);
      return {dx, dy, moved: true};
    }
    document.getElementById('document').addEventListener('pointerdown', event => {
      if (!figureEditMode || event.button !== 0 || !Number.isSafeInteger(figureChangedtick)) return;
      const target = event.target.closest?.('[data-draft-node]');
      if (!target) return;
      const name = target.dataset.draftNode;
      const svg = target.ownerSVGElement;
      if (!svg || target.parentElement !== svg) return;
      const groups = [...svg.querySelectorAll('[data-draft-node]')].filter(group => group.dataset.draftNode === name && group.parentElement === svg);
      const baseX = Number(target.dataset.draftXshift), baseY = Number(target.dataset.draftYshift);
      const origin = dragPoint(svg, event.clientX, event.clientY);
      if (!groups.length || !origin || !Number.isFinite(baseX) || !Number.isFinite(baseY)) return;
      activeFigureDrag = {name, svg, groups, origin, startX: event.clientX, startY: event.clientY,
        baseX, baseY, tick: figureChangedtick,
        transforms: groups.map(group => [group, group.getAttribute('transform')]), moved: false};
      for (const group of groups) group.classList.add('dragging');
      try { svg.setPointerCapture(event.pointerId); } catch (_) {}
      event.preventDefault();
    });
    window.addEventListener('pointermove', event => {
      if (!activeFigureDrag) return;
      placeDrag(activeFigureDrag, event.clientX, event.clientY);
    });
    window.addEventListener('pointerup', event => {
      const drag = activeFigureDrag;
      if (!drag) return;
      activeFigureDrag = null;
      const delta = placeDrag(drag, event.clientX, event.clientY);
      if (!delta?.moved || !drag.groups.some(group => group.isConnected)) {
        restoreDrag(drag);
        return;
      }
      for (const group of drag.groups) group.classList.remove('dragging');
      pendingFigureEdit = drag;
      const scale = Number(drag.svg.dataset.texPtPerUnit);
      const tex = texDisplacement(delta.dx, delta.dy, scale);
      const shift = shiftAfterDrag(drag.baseX, drag.baseY, tex.x, tex.y);
      const dx = shift.x, dy = shift.y;
      const query = new URLSearchParams({name: drag.name, dx: String(dx), dy: String(dy), tick: String(drag.tick)});
      const request = new CustomEvent('draft-node-edit', {detail: {name: drag.name, dx, dy, tick: drag.tick}, cancelable: true});
      window.dispatchEvent(request);
      if (!request.defaultPrevented) window.location.href = `draft://edit-node?${query}`;
      event.preventDefault();
    });
    window.addEventListener('pointercancel', () => {
      if (!activeFigureDrag) return;
      restoreDrag(activeFigureDrag);
      activeFigureDrag = null;
    });
    window.completeNodeEdit = function(ok, error) {
      const drag = pendingFigureEdit;
      pendingFigureEdit = null;
      if (!drag) return;
      if (ok) {
        figureEditError = null;
        return;
      }
      restoreDrag(drag);
      figureEditError = error || 'source changed or node syntax is unsupported';
      updateProblems([problem('warning', `Label edit rejected: ${figureEditError}`, 0, byteLength(source))]);
    };
    window.updateFigure = function(svg, error, changedtick) {
      const changed = Boolean(svg) && svg !== figureSVG;
      if (svg) {
        figureSVG = svg;
        figureChangedtick = Number.isSafeInteger(changedtick) ? changedtick : null;
        figureEditError = null;
      }
      figureError = error || null;
      if (changed || !document.querySelector('.tikz-figure svg')) render();
      else if (figureError) updateProblems([problem('error', `TikZ preview: ${figureError}`, 0, byteLength(source))]);
      else updateProblems([]);
    };
    window.resetFigure = function() {
      figureSVG = null;
      figureChangedtick = null;
      figureEditMode = false;
      figureError = null;
      figureEditError = null;
      render();
    };

    window.addEventListener('load', render);
  </script>
</body>
</html>
